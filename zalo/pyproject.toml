[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zalo-module"
version = "0.1.0"
description = "Independent Zalo intake module (MIN-91)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.47",
    "python-dotenv",
    "httpx",
    "PyMuPDF==1.24.5",
    "Pillow>=10",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
