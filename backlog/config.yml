project_name: "systemdocs"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
definition_of_done:
  - Spec trong docs/spec đã cập nhật hoặc thêm mới
  - Quyết định đã ghi vào backlog decision (là gì, tại sao)
  - Tests pass
task_prefix: "task"
