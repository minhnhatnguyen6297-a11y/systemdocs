[workflow]
# Relative file facts resolve under the active project root, not the skill install.
persistent_facts = ["file:_bmad/custom/html-plan/authoring.md"]
activation_steps_append = ["""
Load {project-root}/_bmad/custom/html-plan/authoring.md and
{project-root}/_bmad-output/specs/shared/visual-html-plans.md now; keep the
contract active throughout this build. Resolve the relative file: fact from
project root, never from the installed skill directory.
At step-02 CHECKPOINT 1 / PLAN, after investigation and self-review but BEFORE
presenting the plan and asking for approval, author the exhibit-first HTML,
pack it with Node using the repository root, visually inspect closed/open/state
views, and present its clickable packed path alongside the canonical Markdown
plan. For oneshot changes needing visual explanation, do this before
implementation without adding an approval gate. Follow the contract's trivial
task exception and browser-unavailable disclosure. Preserve existing BMAD
routing, plan template, source-of-truth artifacts and approval semantics;
Respond is optional and unseen defaults are not agreement. Do not postpone
this presentation to on_complete.
""",
"Load {project-root}/_bmad-output/specs/shared/adaptive-coding-flow.md and follow its adaptive contract. Short-clear work uses a todo, exactly ONE implementation worker, a real test/smoke, then ONE independent quick reviewer; hard work uses the full workflow with the same worker/review ownership. Unless the user explicitly requests direct work in this session, on oneshot the coordinator MUST NOT write the implementation itself: dispatch exactly one worker to run the oneshot implement section and the real test/smoke. The coordinator owns review and dispatches reviewers; implementation workers never review or spawn workers. One quick reviewer is the default for both routes. Add a named lens only for a concrete risk specific to that lens: announce the deciding risk reason in one line before launching and record an evidence-based disposition of every finding afterwards. A clean review is valid. Load/update the relevant spec under _bmad-output/specs/ before changing behavior. Use the current harness native subagents by default; use Orca only when explicitly requested by the user, following its skill and current guide. Workers never spawn workers. Preserve the existing HTML plan contract, plan template, and approval semantics. Route selection: Choose oneshot only when the requirements are clear, the implementation pattern/conventions are known, reliable verification is known, risk is low, and no consequential decision remains unresolved. Choose full if behavior/architecture needs an owner decision, implementation or reliable verification is unknown, risk is high, multiple owners are affected, or a consequential decision is unresolved. Line counts and file counts are supporting signals only, never the deciding rule. State the deciding reason in one line; if clarity is insufficient, state what is missing. Review none is allowed only when the user explicitly pins none; never skip review because a gated selection is empty. Thorough always runs its ungated Quick baseline before any qualifying extras. Inspect/explore the repository and requirements before deciding the route; unknown risk before inspection alone does not force full. Brainstorm only when needed; write the spec when intent is sufficient; code-review is for code and other artifacts use an appropriate review. Hard work uses only the necessary full-workflow stages. Run real tests/smoke BEFORE review. After EVERY review patch, re-engage the SAME original implementation worker to fix it and rerun the relevant real tests/smoke AFTER the patch, on oneshot, full, and standalone review apply-patches paths; never finalize until the rerun passes with recorded evidence. The coordinator owns review. For EACH launched lens, record a separate summary of accepted findings, rejected findings with evidence, or no findings, as well as the evidence-based disposition of every finding. Thorough keeps its ungated Quick baseline plus four gated extras; none is allowed only when the user explicitly pins none."
]

review = "quick"
route_selection = "Inspect/explore the repository first, preserving the installed investigation-before-routing sequence; unknown risk before inspection alone does not force full. Choose oneshot only when the requirements are clear, the implementation pattern/conventions are known, reliable verification is known, risk is low, and no consequential decision remains unresolved. Choose full if behavior/architecture needs an owner decision, implementation or reliable verification is unknown, risk is high, multiple owners are affected, or a consequential decision is unresolved. Line counts and file counts are supporting signals only, never the deciding rule. State the deciding reason in one line; if clarity is insufficient, state what is missing."
implementation_handoff = "The coordinator dispatches exactly ONE implementation subagent through the current harness native mechanism. Use Orca only when explicitly requested by the user; then load its skill and current supported guide. Provide a self-contained task: actual target files, tasks from {plan_file}, constraints, implementation-only ownership and observable acceptance. Read {plan_file} fully and every frontmatter context file. Implement only its tasks, run real tests/smoke BEFORE coordinator review, and report changes, commands/results and incomplete or risky work through the harness completion mechanism. Do not review or spawn agents. The SAME original implementation worker fixes review patches and reruns relevant tests/smoke AFTER each patch before completion. If the user explicitly asks the coordinator to work directly in this session, perform implementation and verification here instead; disclose any missing independent review."

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = "The coordinator dispatches exactly ONE independent, context-free reviewer through the current harness native subagent mechanism. Use Orca only when the user explicitly requests it; then load its skill and current supported guide. Give the reviewer a self-contained task with the actual scope, relevant context, read-only ownership and acceptance criteria. Do not hardcode a provider, model or CLI. The reviewer must not edit implementation, invoke skills or spawn agents. A clean result is valid; no finding quota. Review prompt:\n\nRead `{plan_file}` — the plan holding the acceptance criteria and intent — and the files its frontmatter `context:` lists. Read the agent instruction files (`AGENTS.md`, `CLAUDE.md`, or equivalents) at the repository root and in the directories the diff touches; those are the rules. Then read the unified diff at `{diff_file}` — it is the change under review.\n\nReport unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nReturn findings with evidence, or an explicit clean result, through the selected harness completion mechanism. The coordinator records accepted findings, rejected findings with evidence, or no findings separately for each launched lens."

[[workflow.thorough_lenses]]
id = "quick"
name = "Quick"
instruction = "The coordinator dispatches exactly ONE independent, context-free reviewer through the current harness native subagent mechanism. Use Orca only when the user explicitly requests it; then load its skill and current supported guide. Give the reviewer a self-contained task with the actual scope, relevant context, read-only ownership and acceptance criteria. Do not hardcode a provider, model or CLI. The reviewer must not edit implementation, invoke skills or spawn agents. A clean result is valid; no finding quota. Review prompt:\n\nRead `{plan_file}` — the plan holding the acceptance criteria and intent — and the files its frontmatter `context:` lists. Read the agent instruction files (`AGENTS.md`, `CLAUDE.md`, or equivalents) at the repository root and in the directories the diff touches; those are the rules. Then read the unified diff at `{diff_file}` — it is the change under review.\n\nReport unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nReturn findings with evidence, or an explicit clean result, through the selected harness completion mechanism. The coordinator records accepted findings, rejected findings with evidence, or no findings separately for each launched lens."

[[workflow.thorough_lenses]]
id = "blind-hunter"
name = "Blind Hunter"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to missing requirements or omitted behavior in the diff; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "The coordinator dispatches exactly ONE independent, context-free reviewer through the current harness native subagent mechanism. Use Orca only when the user explicitly requests it; then load its skill and current supported guide. Give the reviewer a self-contained task with the actual scope, relevant context, read-only ownership and acceptance criteria. Do not hardcode a provider, model or CLI. The reviewer must not edit implementation, invoke skills or spawn agents. A clean result is valid; no finding quota. Review prompt:\n\nConduct a review of CONTENT.\nLook for what's missing, not only what's wrong.\nOutput a Markdown list of findings only — no severity, priority, or ranking.\nIf the content is empty, stop and say so.\n\nCONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nReturn findings with evidence, or an explicit clean result, through the selected harness completion mechanism. The coordinator records accepted findings, rejected findings with evidence, or no findings separately for each launched lens."

[[workflow.thorough_lenses]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to boundary inputs, exceptional states, or failure paths; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "The coordinator dispatches exactly ONE independent, context-free reviewer through the current harness native subagent mechanism. Use Orca only when the user explicitly requests it; then load its skill and current supported guide. Give the reviewer a self-contained task with the actual scope, relevant context, read-only ownership and acceptance criteria. Do not hardcode a provider, model or CLI. The reviewer must not edit implementation, invoke skills or spawn agents. A clean result is valid; no finding quota. Review prompt:\n\nRead `{skill-root}/review-prompts/edge-case-hunter.md` completely and follow it as your review instructions.\n\nclaims_file (leave unread until your instructions call for it): {claims_file}\n\nReview content: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nReturn findings with evidence, or an explicit clean result, through the selected harness completion mechanism. The coordinator records accepted findings, rejected findings with evidence, or no findings separately for each launched lens."

