[workflow]
# Relative file facts resolve under the active project root, not the skill install.
persistent_facts = ["file:_bmad/custom/html-plan/authoring.md"]
activation_steps_append = ["""
Load {project-root}/_bmad/custom/html-plan/authoring.md and
{project-root}/_bmad-output/specs/shared/visual-html-plans.md now; keep the
contract active throughout this build. Resolve the relative file: fact from
project root, never from the installed skill directory.
At step-02 CHECKPOINT 1 / PLAN, after investigation and self-review but BEFORE
presenting the plan and asking for approval, author the exhibit-first HTML,
pack it with Node using the repository root, visually inspect closed/open/state
views, and present its clickable packed path alongside the canonical Markdown
plan. For oneshot changes needing visual explanation, do this before
implementation without adding an approval gate. Follow the contract's trivial
task exception and browser-unavailable disclosure. Preserve existing BMAD
routing, plan template, source-of-truth artifacts and approval semantics;
Respond is optional and unseen defaults are not agreement. Do not postpone
this presentation to on_complete.
""",
"Load {project-root}/_bmad-output/specs/shared/adaptive-coding-flow.md and follow its adaptive contract. Short-clear work uses a todo, exactly ONE Orca implementation worker, a real test/smoke, then ONE independent quick reviewer; hard work uses the full workflow with the same worker/review ownership. On oneshot the coordinator MUST NOT write the implementation itself: dispatch exactly one worker to run the oneshot implement section and the real test/smoke. The coordinator owns review and dispatches reviewers; implementation workers never review or spawn workers. One quick reviewer is the default for both routes. Add a named lens only for a concrete risk specific to that lens: announce the deciding risk reason in one line before launching and record an evidence-based disposition of every finding afterwards. A clean review is valid. Load/update the relevant spec under _bmad-output/specs/ before changing behavior. Use Orca-only orchestration; workers never spawn workers. Preserve the existing HTML plan contract, plan template, and approval semantics. Route selection: Choose oneshot only when the requirements are clear, the implementation pattern/conventions are known, reliable verification is known, risk is low, and no consequential decision remains unresolved. Choose full if behavior/architecture needs an owner decision, implementation or reliable verification is unknown, risk is high, multiple owners are affected, or a consequential decision is unresolved. Line counts and file counts are supporting signals only, never the deciding rule. State the deciding reason in one line; if clarity is insufficient, state what is missing. Review none is allowed only when the user explicitly pins none; never skip review because a gated selection is empty. Thorough always runs its ungated Quick baseline before any qualifying extras."
]

review = "quick"
route_selection = "Choose oneshot only when the requirements are clear, the implementation pattern/conventions are known, reliable verification is known, risk is low, and no consequential decision remains unresolved. Choose full if behavior/architecture needs an owner decision, implementation or reliable verification is unknown, risk is high, multiple owners are affected, or a consequential decision is unresolved. Line counts and file counts are supporting signals only, never the deciding rule. State the deciding reason in one line; if clarity is insufficient, state what is missing."
implementation_handoff = "The coordinator owns review and dispatches exactly ONE implementation worker using the supported Orca orchestration guide. First bind a Run with:\norca orchestration run-create --objective \"<objective>\" --json\nReuse the already bound Run for this task rather than creating another. Compose and write a real, self-contained task spec for THIS dispatch: Target (actual files/component), Change (tasks from {plan_file}), Constraints (invariants and do-not-touch boundaries), Ownership (implementation only; no review or spawning), Observable acceptance (real tests/smoke and required evidence). Include reading {plan_file} fully and all frontmatter context, implementing its tasks, and reporting changes, verification and incomplete/risky work. Pass the actual composed task content as the --spec value:\norca orchestration worker-start --spec \"<actual self-contained task spec>\" --worktree current --agent codex --json\nThe quoted/angle-bracket text is a template replaced with real values at dispatch time, never executed literally. Never pass --model: the implementation worker inherits the configured model. Compare launch.effective with launch.requested before trusting the launch. Wait with:\norca orchestration check --wait --types \"worker_done,escalation,question\" --json\nHandle questions/escalations through Orca and wait for the authoritative worker_done with active task and dispatch IDs. The worker runs real tests/smoke, never reviews or spawns workers; the coordinator owns review."

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = "Before dispatch, follow the supported Orca orchestration guide and bind the coordinator's Run with orca orchestration run-create --objective \"<objective>\" --json if this task has no bound Run. Compose and write a real, self-contained task spec for THIS dispatch with Target, Change, Constraints, Ownership, and Observable acceptance, incorporating the complete review prompt and actual report path below; pass its actual content as --spec. All quoted/angle-bracket text in the command examples is a template replaced at dispatch time, never executed literally. After launch, compare launch.effective with launch.requested before trusting it, and wait with orca orchestration check --wait --types \"worker_done,escalation,question\" --json; handle questions/escalations through Orca. The coordinator remains review owner.\nThe coordinator dispatches exactly ONE independent, context-free Orca reviewer for this lens using:\norca orchestration worker-start --spec \"<self-contained review task containing the complete prompt below, repository/file scope, read-only ownership, acceptance, and a concrete report file path under _bmad-output/tmp/>\" --worktree current --agent codex --model gpt-6.1-sol --effort high\nVerify launch.effective matches launch.requested. The reviewer must not edit implementation files, invoke skills, or spawn workers. A clean result is valid; do not invent findings or require a minimum count. Keep the following review prompt intact:\n\nRead `{plan_file}` — the plan holding the acceptance criteria and intent — and the files its frontmatter `context:` lists. Read the agent instruction files (`AGENTS.md`, `CLAUDE.md`, or equivalents) at the repository root and in the directories the diff touches; those are the rules. Then read the unified diff at `{diff_file}` — it is the change under review.\n\nReport unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nDelivery instruction: write the review findings (or an explicit clean result) to the concrete Markdown report file assigned in the task spec. Return findings as text, and send worker_done exactly once with the active taskId and dispatchId, a three-sentence summary, explicit outcome, and --report-path pointing to that file; no other findings-reporting tool. The coordinator records the evidence-based disposition of every finding after the report returns."

