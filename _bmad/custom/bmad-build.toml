[workflow]
# Relative file facts resolve under the active project root, not the skill install.
persistent_facts = ["file:_bmad/custom/html-plan/authoring.md", "file:_bmad/custom/html-plan/phases.md"]
activation_steps_append = ["""
Cloud package wiring repair: read {project-root}/_bmad/custom/html-plan/phases.md
fully now and retain its phase-local instructions while following just-in-time
step files. Re-read its Build CHECKPOINT 1 section before the existing plan
presentation, or its oneshot section before implementation (including resume).
Generate the task-specific packed HTML there; the packaged BMAD-FLOW.html and
html-plan-example.html are guidance/examples, never substitutes for this task.
Load {project-root}/_bmad/custom/html-plan/authoring.md and
{project-root}/_bmad-output/specs/shared/visual-html-plans.md now; keep the
contract active throughout this build. Resolve the relative file: fact from
project root, never from the installed skill directory.
At step-02 CHECKPOINT 1 / PLAN, after investigation and self-review but BEFORE
presenting the plan and asking for approval, author the exhibit-first HTML,
pack it with Node using the repository root, visually inspect closed/open/state
views, and present its clickable packed path alongside the canonical Markdown
plan. For oneshot changes needing visual explanation, do this before
implementation without adding an approval gate. Follow the contract's trivial
task exception and browser-unavailable disclosure. Preserve existing BMAD
routing, plan template, source-of-truth artifacts and approval semantics;
Respond is optional and unseen defaults are not agreement. Do not postpone
this presentation to on_complete.
""",
"Load {project-root}/_bmad-output/specs/shared/adaptive-coding-flow.md now; follow its execution rights, planning triggers, handoff, failure handling and task completion rules throughout this build. Short-clear: todo, ONE implementation worker, real verification BEFORE review, ONE independent Quick reviewer. On oneshot the coordinator dispatches the worker to implement; do not silently use the installed main-implements default. An explicit request to implement directly changes the implementer only, not independent review; review may be skipped only on explicit none. Native harness subagents are default; Orca only on explicit request. If requested Orca is unavailable, report blocked rather than silently changing transport. Full uses only planning stages that resolve a concrete gap; no automatic checklist. Preserve HTML plan/spec contract, small-task exception, plan template and existing approval checkpoints. Update relevant behavior spec before code. Coordinator owns delegation/review; workers never spawn. Validate commands/results against acceptance and changed behavior, not merely a green exit. After patches prefer the original implementer; if unavailable inspect partial state and hand off diff, remaining tasks and verification to one replacement, avoiding concurrent mutation. Rerun relevant verification AFTER every patch. Missing reviewer output is not a clean result: inspect/recover or replace, and report blocked if the failure repeats. Accept findings only with evidence; fix or explicitly defer without violating acceptance. Repeated foundational defects after two meaningful fix rounds return to intent/spec/plan. Default one Quick reviewer for either route; thorough retains ungated Quick and risk-gated extras. Announce each extra lens reason before launch and record accepted/rejected-with-evidence/no-findings for every launched lens. Complete only when observable acceptance and final verification pass, review is settled (or explicitly waived), decisions are resolved and code/spec/docs agree; disclose deferred issues and limits."
]

route_selection = "Inspect repository and intent before routing. Choose oneshot when intent, implementation pattern and behavior-linked verification are known, risk is low and no consequential decision remains. Choose full when after inspection a concrete behavior/architecture choice, implementation gap, verification gap or design-level risk remains; state the impact and missing information. Data-loss migrations, unresolved authorization rules or shared contracts are examples, not an automatic checklist. Multiple owners alone do not force full when contracts are settled. Line/file counts are supporting signals only. State the deciding reason in one line. During implementation stop affected work when assumptions fail; investigate and continue or replan/escalate, never guess dependent behavior."
implementation_handoff = "Dispatch exactly ONE implementation subagent through the current harness native mechanism, or requested Orca according to its current guide. An explicit user request for direct implementation uses the coordinator instead but does not waive independent review. Give a self-contained task: goal, behavior/spec sources, actual files/entrypoints, tasks from {plan_file}, scope/non-goals, constraints, observable acceptance and verification commands/scenarios. Read {plan_file} fully and its frontmatter context. Implement only assigned scope, never review or spawn agents. If assumptions fail, stop affected work and report evidence to the coordinator. Run behavior-linked tests/smoke BEFORE review; report changed files, commands/results, acceptance covered, remaining risks and incomplete work. After review patches prefer the same implementer; if unavailable inspect partial state and give one replacement the diff, outstanding findings and verification state without overlapping mutation. Rerun relevant verification AFTER every patch before completion."

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = "The coordinator dispatches exactly ONE independent, context-free reviewer through the current harness native subagent mechanism. Use Orca only when the user explicitly requests it; then load its skill and current supported guide. Give the reviewer a self-contained task with the actual scope, relevant context, read-only ownership and acceptance criteria. Do not hardcode a provider, model or CLI. The reviewer must not edit implementation, invoke skills or spawn agents. A clean result is valid; no finding quota. Review prompt:\n\nRead `{plan_file}` — the plan holding the acceptance criteria and intent — and the files its frontmatter `context:` lists. Read the agent instruction files (`AGENTS.md`, `CLAUDE.md`, or equivalents) at the repository root and in the directories the diff touches; those are the rules. Then read the unified diff at `{diff_file}` — it is the change under review.\n\nReport unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nReturn findings with evidence, or an explicit clean result, through the selected harness completion mechanism. The coordinator records accepted findings, rejected findings with evidence, or no findings separately for each launched lens."

