[[workflow.thorough_lenses]]
id = "intent-alignment"
name = "Intent Alignment Auditor"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to divergent readings of an available verbatim intent or a mismatch between the intended surface and the changed surface; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "The coordinator dispatches exactly ONE independent, context-free reviewer through the current harness native subagent mechanism. Use Orca only when the user explicitly requests it; then load its skill and current supported guide. Give the reviewer a self-contained task with the actual scope, relevant context, read-only ownership and acceptance criteria. Do not hardcode a provider, model or CLI. The reviewer must not edit implementation, invoke skills or spawn agents. A clean result is valid; no finding quota. Review prompt:\n\nYou are an intent-alignment auditor. You have no other context about how this change was produced. Here is the verbatim intent this work started from:\n\n{verbatim_intent}\n\nThe diff is the unified diff at `{diff_file}`. Read that file — it is the change under review.\n\nYour task is strictly descriptive — do not prescribe additional work. Report: (1) the defensible readings of the intent, enumerated; (2) which reading this diff implements; (3) where the readings and the diff diverge — specifically, which surface the intent's expectations live at versus which surface the diff's changes and its tests exercise.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nReturn findings with evidence, or an explicit clean result, through the selected harness completion mechanism. The coordinator records accepted findings, rejected findings with evidence, or no findings separately for each launched lens."
