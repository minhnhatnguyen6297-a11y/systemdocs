[[workflow.thorough_lenses]]
id = "intent-alignment"
name = "Intent Alignment Auditor"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to divergent readings of an available verbatim intent or a mismatch between the intended surface and the changed surface; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "Before dispatch, follow the supported Orca orchestration guide and bind the coordinator's Run with orca orchestration run-create --objective \"<objective>\" --json if this task has no bound Run. Compose and write a real, self-contained task spec for THIS dispatch with Target, Change, Constraints, Ownership, and Observable acceptance, incorporating the complete review prompt and actual report path below; pass its actual content as --spec. All quoted/angle-bracket text in the command examples is a template replaced at dispatch time, never executed literally. After launch, compare launch.effective with launch.requested before trusting it, and wait with orca orchestration check --wait --types \"worker_done,escalation,question\" --json; handle questions/escalations through Orca. The coordinator remains review owner.\nThe coordinator dispatches exactly ONE independent, context-free Orca reviewer for this lens using:\norca orchestration worker-start --spec \"<self-contained review task containing the complete prompt below, repository/file scope, read-only ownership, acceptance, and a concrete report file path under _bmad-output/tmp/>\" --worktree current --agent codex --model gpt-6.1-sol --effort high\nVerify launch.effective matches launch.requested. The reviewer must not edit implementation files, invoke skills, or spawn workers. A clean result is valid; do not invent findings or require a minimum count. Keep the following review prompt intact:\n\nYou are an intent-alignment auditor. You have no other context about how this change was produced. Here is the verbatim intent this work started from:\n\n{verbatim_intent}\n\nThe diff is the unified diff at `{diff_file}`. Read that file — it is the change under review.\n\nYour task is strictly descriptive — do not prescribe additional work. Report: (1) the defensible readings of the intent, enumerated; (2) which reading this diff implements; (3) where the readings and the diff diverge — specifically, which surface the intent's expectations live at versus which surface the diff's changes and its tests exercise.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nDelivery instruction: write the review findings (or an explicit clean result) to the concrete Markdown report file assigned in the task spec. Return findings as text, and send worker_done exactly once with the active taskId and dispatchId, a three-sentence summary, explicit outcome, and --report-path pointing to that file; no other findings-reporting tool. The coordinator records the evidence-based disposition of every finding after the report returns."
