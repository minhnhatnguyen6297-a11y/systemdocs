[workflow]
# Relative file facts resolve under the active project root, not the skill install.
persistent_facts = ["file:_bmad/custom/html-plan/authoring.md"]
activation_steps_append = ["""
Load {project-root}/_bmad/custom/html-plan/authoring.md and
{project-root}/_bmad-output/specs/shared/visual-html-plans.md now; keep the
contract active throughout this build. Resolve the relative file: fact from
project root, never from the installed skill directory.
At step-02 CHECKPOINT 1 / PLAN, after investigation and self-review but BEFORE
presenting the plan and asking for approval, author the exhibit-first HTML,
pack it with Node using the repository root, visually inspect closed/open/state
views, and present its clickable packed path alongside the canonical Markdown
plan. For oneshot changes needing visual explanation, do this before
implementation without adding an approval gate. Follow the contract's trivial
task exception and browser-unavailable disclosure. Preserve existing BMAD
routing, plan template, source-of-truth artifacts and approval semantics;
Respond is optional and unseen defaults are not agreement. Do not postpone
this presentation to on_complete.
""",
"Load {project-root}/_bmad-output/specs/shared/adaptive-coding-flow.md and follow its adaptive contract. Short-clear work uses a todo, exactly ONE Orca implementation worker, a real test/smoke, then ONE independent quick reviewer; hard work uses the full workflow with the same worker/review ownership. On oneshot the coordinator MUST NOT write the implementation itself: dispatch exactly one worker to run the oneshot implement section and the real test/smoke. The coordinator owns review and dispatches reviewers; implementation workers never review or spawn workers. One quick reviewer is the default for both routes. Add a named lens only for a concrete risk specific to that lens: announce the deciding risk reason in one line before launching and record an evidence-based disposition of every finding afterwards. A clean review is valid. Load/update the relevant spec under _bmad-output/specs/ before changing behavior. Use Orca-only orchestration; workers never spawn workers. Preserve the existing HTML plan contract, plan template, and approval semantics. Route selection: Choose oneshot only when the requirements are clear, the implementation pattern/conventions are known, reliable verification is known, risk is low, and no consequential decision remains unresolved. Choose full if behavior/architecture needs an owner decision, implementation or reliable verification is unknown, risk is high, multiple owners are affected, or a consequential decision is unresolved. Line counts and file counts are supporting signals only, never the deciding rule. State the deciding reason in one line; if clarity is insufficient, state what is missing."
]

review = "quick"
route_selection = "Choose oneshot only when the requirements are clear, the implementation pattern/conventions are known, reliable verification is known, risk is low, and no consequential decision remains unresolved. Choose full if behavior/architecture needs an owner decision, implementation or reliable verification is unknown, risk is high, multiple owners are affected, or a consequential decision is unresolved. Line counts and file counts are supporting signals only, never the deciding rule. State the deciding reason in one line; if clarity is insufficient, state what is missing."
implementation_handoff = "The coordinator dispatches exactly ONE implementation worker through Orca:\norca orchestration worker-start --spec \"Read {plan_file} fully as the implementation source of truth; load every file listed in frontmatter context. Implement only its tasks, run the real tests/smoke, report changes, verification evidence, and anything incomplete or risky. Do not review or spawn workers; the coordinator owns review.\" --worktree current --agent codex\nDo not pass --model. Follow the active Orca orchestration guide for completion and waiting; the worker reports through worker_done with the active task and dispatch IDs."

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = "The coordinator dispatches exactly ONE independent, context-free Orca reviewer for this lens using:\norca orchestration worker-start --spec \"<self-contained review task containing the complete prompt below, repository/file scope, read-only ownership, acceptance, and a concrete report file path under _bmad-output/tmp/>\" --worktree current --agent codex --model gpt-6.1-sol --effort high\nVerify launch.effective matches launch.requested. The reviewer must not edit implementation files, invoke skills, or spawn workers. A clean result is valid; do not invent findings or require a minimum count. Keep the following review prompt intact:\n\nRead `{plan_file}` — the plan holding the acceptance criteria and intent — and the files its frontmatter `context:` lists. Read the agent instruction files (`AGENTS.md`, `CLAUDE.md`, or equivalents) at the repository root and in the directories the diff touches; those are the rules. Then read the unified diff at `{diff_file}` — it is the change under review.\n\nReport unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nDelivery instruction: write the review findings (or an explicit clean result) to the concrete Markdown report file assigned in the task spec. Return findings as text, and send worker_done exactly once with the active taskId and dispatchId, a three-sentence summary, explicit outcome, and --report-path pointing to that file; no other findings-reporting tool. The coordinator records the evidence-based disposition of every finding after the report returns."

[[workflow.thorough_lenses]]
id = "blind-hunter"
name = "Blind Hunter"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to missing requirements or omitted behavior in the diff; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "The coordinator dispatches exactly ONE independent, context-free Orca reviewer for this lens using:\norca orchestration worker-start --spec \"<self-contained review task containing the complete prompt below, repository/file scope, read-only ownership, acceptance, and a concrete report file path under _bmad-output/tmp/>\" --worktree current --agent codex --model gpt-6.1-sol --effort high\nVerify launch.effective matches launch.requested. The reviewer must not edit implementation files, invoke skills, or spawn workers. A clean result is valid; do not invent findings or require a minimum count. Keep the following review prompt intact:\n\nConduct a review of CONTENT.\nLook for what's missing, not only what's wrong.\nOutput a Markdown list of findings only — no severity, priority, or ranking.\nIf the content is empty, stop and say so.\n\nCONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nDelivery instruction: write the review findings (or an explicit clean result) to the concrete Markdown report file assigned in the task spec. Return findings as text, and send worker_done exactly once with the active taskId and dispatchId, a three-sentence summary, explicit outcome, and --report-path pointing to that file; no other findings-reporting tool. The coordinator records the evidence-based disposition of every finding after the report returns."

[[workflow.thorough_lenses]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to boundary inputs, exceptional states, or failure paths; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "The coordinator dispatches exactly ONE independent, context-free Orca reviewer for this lens using:\norca orchestration worker-start --spec \"<self-contained review task containing the complete prompt below, repository/file scope, read-only ownership, acceptance, and a concrete report file path under _bmad-output/tmp/>\" --worktree current --agent codex --model gpt-6.1-sol --effort high\nVerify launch.effective matches launch.requested. The reviewer must not edit implementation files, invoke skills, or spawn workers. A clean result is valid; do not invent findings or require a minimum count. Keep the following review prompt intact:\n\nRead `{skill-root}/review-prompts/edge-case-hunter.md` completely and follow it as your review instructions.\n\nclaims_file (leave unread until your instructions call for it): {claims_file}\n\nReview content: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nDelivery instruction: write the review findings (or an explicit clean result) to the concrete Markdown report file assigned in the task spec. Return findings as text, and send worker_done exactly once with the active taskId and dispatchId, a three-sentence summary, explicit outcome, and --report-path pointing to that file; no other findings-reporting tool. The coordinator records the evidence-based disposition of every finding after the report returns."

[[workflow.thorough_lenses]]
id = "verification-gap"
name = "Verification Gap Reviewer"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to a concrete behavior whose test/smoke evidence may not prove it; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "The coordinator dispatches exactly ONE independent, context-free Orca reviewer for this lens using:\norca orchestration worker-start --spec \"<self-contained review task containing the complete prompt below, repository/file scope, read-only ownership, acceptance, and a concrete report file path under _bmad-output/tmp/>\" --worktree current --agent codex --model gpt-6.1-sol --effort high\nVerify launch.effective matches launch.requested. The reviewer must not edit implementation files, invoke skills, or spawn workers. A clean result is valid; do not invent findings or require a minimum count. Keep the following review prompt intact:\n\nRead `{skill-root}/review-prompts/verification-gap.md` completely and follow it as your review instructions.\n\nReview content: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nDelivery instruction: write the review findings (or an explicit clean result) to the concrete Markdown report file assigned in the task spec. Return findings as text, and send worker_done exactly once with the active taskId and dispatchId, a three-sentence summary, explicit outcome, and --report-path pointing to that file; no other findings-reporting tool. The coordinator records the evidence-based disposition of every finding after the report returns."

[[workflow.thorough_lenses]]
id = "intent-alignment"
name = "Intent Alignment Auditor"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to divergent readings of an available verbatim intent or a mismatch between the intended surface and the changed surface; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "The coordinator dispatches exactly ONE independent, context-free Orca reviewer for this lens using:\norca orchestration worker-start --spec \"<self-contained review task containing the complete prompt below, repository/file scope, read-only ownership, acceptance, and a concrete report file path under _bmad-output/tmp/>\" --worktree current --agent codex --model gpt-6.1-sol --effort high\nVerify launch.effective matches launch.requested. The reviewer must not edit implementation files, invoke skills, or spawn workers. A clean result is valid; do not invent findings or require a minimum count. Keep the following review prompt intact:\n\nYou are an intent-alignment auditor. You have no other context about how this change was produced. Here is the verbatim intent this work started from:\n\n{verbatim_intent}\n\nThe diff is the unified diff at `{diff_file}`. Read that file — it is the change under review.\n\nYour task is strictly descriptive — do not prescribe additional work. Report: (1) the defensible readings of the intent, enumerated; (2) which reading this diff implements; (3) where the readings and the diff diverge — specifically, which surface the intent's expectations live at versus which surface the diff's changes and its tests exercise.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nDelivery instruction: write the review findings (or an explicit clean result) to the concrete Markdown report file assigned in the task spec. Return findings as text, and send worker_done exactly once with the active taskId and dispatchId, a three-sentence summary, explicit outcome, and --report-path pointing to that file; no other findings-reporting tool. The coordinator records the evidence-based disposition of every finding after the report returns."
