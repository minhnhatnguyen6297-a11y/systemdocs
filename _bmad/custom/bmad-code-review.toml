[workflow]
review = "quick"
activation_steps_append = ["The coordinator owns review. Default to exactly ONE independent quick reviewer. Launch an extra named lens only after announcing its concrete, lens-specific risk reason in one line; record the evidence-based disposition of every finding afterwards. A clean result is valid. Use current harness native subagents by default; Orca only on explicit user request. Reviewers invoke no skills and never spawn workers. Review none is allowed only when the user explicitly pins none; never skip review because a gated selection is empty. Thorough always runs its ungated Quick baseline before any qualifying extras. Inspect/explore the repository and requirements before deciding the route; unknown risk before inspection alone does not force full. Brainstorm only when needed; write the spec when intent is sufficient; code-review is for code and other artifacts use an appropriate review. Hard work uses only the necessary full-workflow stages. Run real tests/smoke BEFORE review. After EVERY review patch, re-engage the SAME original implementation worker to fix it and rerun the relevant real tests/smoke AFTER the patch, on oneshot, full, and standalone review apply-patches paths; never finalize until the rerun passes with recorded evidence. The coordinator owns review. For EACH launched lens, record a separate summary of accepted findings, rejected findings with evidence, or no findings, as well as the evidence-based disposition of every finding. Thorough keeps its ungated Quick baseline plus four gated extras; none is allowed only when the user explicitly pins none."]

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = "The coordinator dispatches exactly ONE independent, context-free reviewer through the current harness native subagent mechanism. Use Orca only when the user explicitly requests it; then load its skill and current supported guide. Give the reviewer a self-contained task with the actual scope, relevant context, read-only ownership and acceptance criteria. Do not hardcode a provider, model or CLI. The reviewer must not edit implementation, invoke skills or spawn agents. A clean result is valid; no finding quota. Review prompt:\n\nRead `{plan_file}` — the plan holding the acceptance criteria and intent; it is empty when there is none — and the files its frontmatter `context:` lists. Read the agent instruction files (`AGENTS.md`, `CLAUDE.md`, or equivalents) at the repository root and in the directories the diff touches; those are the rules. Then read the unified diff at `{diff_file}` — it is the change under review.\n\nReport unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nReturn findings with evidence, or an explicit clean result, through the selected harness completion mechanism. The coordinator records accepted findings, rejected findings with evidence, or no findings separately for each launched lens."

