[[workflow.thorough_lenses]]
id = "blind-hunter"
name = "Blind Hunter"
when = "Only when the coordinator has named this lens and announced in one line before launch a concrete risk reason specific to missing requirements or omitted behavior in the diff; a thorough selection alone does not qualify. Otherwise skip this lens."
instruction = "The coordinator dispatches exactly ONE independent, context-free reviewer through the current harness native subagent mechanism. Use Orca only when the user explicitly requests it; then load its skill and current supported guide. Give the reviewer a self-contained task with the actual scope, relevant context, read-only ownership and acceptance criteria. Do not hardcode a provider, model or CLI. The reviewer must not edit implementation, invoke skills or spawn agents. A clean result is valid; no finding quota. Review prompt:\n\nConduct a review of CONTENT.\nLook for what's missing, not only what's wrong.\nOutput a Markdown list of findings only — no severity, priority, or ranking.\nIf the content is empty, stop and say so.\n\nCONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\nReturn findings with evidence, or an explicit clean result, through the selected harness completion mechanism. The coordinator records accepted findings, rejected findings with evidence, or no findings separately for each launched lens."

