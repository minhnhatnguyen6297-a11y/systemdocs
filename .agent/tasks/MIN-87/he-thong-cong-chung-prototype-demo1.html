/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.

@layer od-layout {

  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }

  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */

  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }

  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}

<noscript><p>Bật JavaScript để thao tác với bản demo ngoại tuyến này.</p></noscript>
<script>
'use strict';

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const ICONS={
 folder:'<path d="M3 7h7l2 2h9v11H3z"/><path d="M3 7V4h7l2 3"/>',
 upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/>',
 office:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2m4 0h2M8 11h2m4 0h2M10 21v-6h4v6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',
 arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 close:'<path d="m6 6 12 12M6 18 18 6"/>',

 search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
 file:'<path d="M5 3h9l5 5v13H5zM14 3v6h5M8 13h8m-8 4h6"/>',
 users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v2"/>',
 alert:'<path d="m12 3 10 18H2zM12 9v5m0 3v1"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',
 back:'<path d="M19 12H5m5-5-5 5 5 5"/>',
 layers:'<path d="m12 3 10 5-10 5L2 8zM2 12l10 5 10-5M2 16l10 5 10-5"/>',
 shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/>',
 refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 8a8 8 0 0 1 14-2l1 6M4 12l1 6a8 8 0 0 0 14-2"/>'
};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.file}</svg>`;
const attrs=o=>Object.entries(o||{}).map(([k,v])=>` data-${k}="${esc(v)}"`).join('');
const btn=(a,t,d={},c='',disabled=false)=>{const name=t.replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<[^>]*>/g,'').trim()||({inspect:'Xem dữ kiện nguồn','case-search':'Tìm hồ sơ',close:'Đóng cửa sổ'})[a]||'Mở chi tiết';return `<button type="button" aria-label="${esc(name)}" data-action="${a}"${attrs(d)} class="${c}"${disabled?' disabled':''}>${t}</button>`};
const badge=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const note=(t,c='')=>`<div class="notice ${c}">${t}</div>`;
const options=(list,v)=>list.map(o=>{const [val,label]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${String(v)===String(val)?' selected':''}>${esc(label)}</option>`}).join('');
const select=(a,l,v,list,d={})=>`<label>${esc(l)}<select data-change="${a}"${attrs(d)}>${options(list,v)}</select></label>`;
const input=(a,l,v,d={},type='text')=>`<label>${esc(l)}<input type="${type}" data-input="${a}"${attrs(d)} value="${esc(v)}" autocomplete="off"></label>`;
const check=(a,l,v,d={})=>`<label class="check"><input type="checkbox" data-change="${a}"${attrs(d)}${v?' checked':''}><span>${esc(l)}</span></label>`;
const empty=(t,p,a)=>`<div class="empty-state">${icon('folder')}<h3>${t}</h3><p class="muted">${p}</p>${a||''}</div>`;
const SIM='Mô phỏng trong prototype — không kết nối dịch vụ thật.';
const STORE='min87-notary-demo-v1';
function person(id,name,committed=true){return {id,name,detail:'Dữ liệu hư cấu, không phải giấy tờ hợp lệ',source:'DEMO_ID_A_FRONT.png',committed,dirty:false,snapshot:committed?{name,detail:'Dữ liệu hư cấu, không phải giấy tờ hợp lệ'}:null}}
function makeCase(id,title,mode='ab',blank=false){
 const people=blank?[]:[person('DEMO-PERSON-A','NHÂN VẬT HƯ CẤU A'),person('DEMO-PERSON-B','NHÂN VẬT HƯ CẤU B'),person('DEMO-PERSON-C','NHÂN VẬT HƯ CẤU C',false)];
 const assets=blank?[]:[1,2].map(i=>({id:`DEMO-ASSET-0${i}`,name:`TÀI SẢN HƯ CẤU 0${i}`,detail:'Nguồn chung DEMO_GCN_NONVALID.pdf',source:'DEMO_GCN_NONVALID.pdf',committed:true,dirty:false,snapshot:{name:`TÀI SẢN HƯ CẤU 0${i}`,detail:'Nguồn chung DEMO_GCN_NONVALID.pdf'}}));
 return {id,title,mode,contract:'Chuyển nhượng',people,assets,assign:blank?{}:{'DEMO-PERSON-A':mode==='ab'?'A':'root','DEMO-PERSON-B':mode==='ab'?'B':'children'},selectedAssets:blank?[]:['DEMO-ASSET-01'],revision:1,diagramVersion:1,diagramSaved:!blank,diagramStale:false,intake:'idle',intakeSelected:['id','asset','note'],classified:'unknown',cloud:false,intakeTransferred:false,word:{docs:{main:true,tax:true,request:true},template:'DEMO-TPL-v1',taxField:'',outputs:[],stale:false,prechecked:false}};
}
function initial(){return {
 version:1,route:'NV2-01',caseId:'CASE-DEMO-001',caseQuery:'',cases:[makeCase('CASE-DEMO-001','Hồ sơ giao dịch DEMO-A'),makeCase('CASE-DEMO-THUAKE-01','Hồ sơ thừa kế DEMO-A','family')],
 scroll:{},visits:{notary:'NV2-01',upload:'UL-01',office:'NO-01'},viewStates:{},jobs:[],health:'online',
 zalo:{status:'waiting',sources:[],policy:false,messages:[],transferred:[]},
 upload:{portal:'CỔNG TỈNH HƯ CẤU 01',book:'SỔ CÔNG CHỨNG DEMO-A',year:'2025',coverage:false,analyzed:false,analysisState:'idle',capability:'scan',engine:true,overLimit:false,queue:[],activeRow:'1/2025',portalState:'login',sessionStarted:false},
 office:{query:'',searched:false,scope:'own',caseId:'CASE-DEMO-THUAKE-01',recordId:'REC-DEMO-THUA-01',period:'day',filterType:'all',filterStatus:'all',filterSource:'all',proposal:{type:'Thừa kế',caseId:'CASE-DEMO-THUAKE-01',state:'candidate',evidence:'full',decision:'',linkExisting:true,reason:''},records:[
 {id:'REC-DEMO-THUA-01',caseId:'CASE-DEMO-THUAKE-01',type:'Thừa kế',status:'Đang xử lý',fee:'unknown',amount:'',source:'Word',station:'PC-DEMO-02',evidence:['EVD-DEMO-WORD-01'],files:['Văn bản chính DEMO'],history:['Tiếp nhận yêu cầu DEMO','Đang xử lý hồ sơ'],date:'2026-09-22'},
 {id:'REC-DEMO-GIAHAN-01',caseId:'CASE-DEMO-THUAKE-01',type:'Gia hạn đất',status:'Đã tiếp nhận',fee:'unknown',amount:'',source:'Thủ công',station:'PC-DEMO-02',evidence:['EVD-DEMO-PRINT-01'],files:[],history:['Đã tiếp nhận yêu cầu DEMO'],date:'2026-09-22'},
 {id:'REC-DEMO-DODAC-01',caseId:'CASE-DEMO-THUAKE-01',type:'Đo đạc',status:'Dự kiến',fee:'unknown',amount:'',source:'Scan',station:'PC-DEMO-02',evidence:['EVD-DEMO-SCAN-01'],files:[],history:['Dự kiến ngày 25/09/2026 — chưa hoàn thành'],date:'2026-09-22'}
 ]},nextId:3
}}
let s;
try{const raw=JSON.parse(localStorage.getItem(STORE)||'null');s=raw?.version===1&&raw.cases?.length&&raw.office?.records?raw:initial()}catch{s=initial()}
const C=()=>s.cases.find(c=>c.id===s.caseId)||s.cases[0];
const U=()=>s.upload;
const R=()=>s.office.records.find(r=>r.id===s.office.recordId)||s.office.records[0];
const dirty=()=>s.cases.some(c=>[...c.people,...c.assets].some(p=>p.dirty||!p.committed))||s.office.records.some(r=>r.feeDraft);
const moduleOf=r=>r.startsWith('UL')?'upload':r.startsWith('NO')?'office':'notary';
const moduleNames={notary:'Soạn hồ sơ',upload:'Phân tích & Upload',office:'Văn phòng'};
const screens={
 'NV2-01':'Hồ sơ đang xử lý','NV2-02':'Bàn soạn hai bên','NV2-03':'Sơ đồ thừa kế','NV2-04':'Thu nhận & dữ liệu','NV2-05':'Kết nối Zalo','NV2-06':'Nguồn & tin nhắn','NV2-07':'Xuất bộ văn bản',
 'UL-01':'Ngữ cảnh đối soát','UL-02':'Phân tích dữ liệu','UL-03':'Hàng đợi upload','UL-04':'Chuẩn bị tệp đính kèm','UL-05':'Phiên cổng mô phỏng','UL-06':'Kết quả từng mục',
 'NO-01':'Tra cứu văn phòng','NO-02':'Rà soát đề xuất','NO-03':'Chi tiết hồ sơ','NO-04':'Chi tiết công việc','NO-05':'Tổng hợp công việc','DB-01':'Hạ tầng dữ liệu','SH-02':'Tác vụ & hệ thống'
};
let dialogReturn=null,dialogRoute=null,dialogData={},pendingConfirm=null,toastTimer;
function save(){try{localStorage.setItem(STORE,JSON.stringify(s))}catch{}}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},4200)}
function job(id,title,route,status){let j=s.jobs.find(x=>x.id===id);if(!j){j={id,title,route,status,caseId:s.caseId};s.jobs.unshift(j)}Object.assign(j,{title,route,status});save()}
const jobLabels={accepted:'Đã tiếp nhận',running:'Đang chạy',waiting_user:'Chờ bạn',partial:'Xong một phần',failed:'Lỗi',succeeded:'Đã xong',canceled:'Đã hủy'};
function navigate(route,data={}){
 if(!screens[route])return;
 if(route==='NV2-05'||route==='NV2-06'||route==='SH-02'||route==='UL-04'){openScreen(route,data);return}
 s.scroll[s.route]=window.scrollY;s.route=route;
 if(data.case){s.caseId=data.case}
 if(data.officecase)s.office.caseId=data.officecase;
 if(data.record)s.office.recordId=data.record;
 s.visits[moduleOf(route)]=route;closeDialog(false);save();render();
 requestAnimationFrame(()=>{window.scrollTo(0,s.scroll[route]||0);$('#page-title')?.focus({preventScroll:true})});
}
function changeModule(m){
 const target=s.visits[m]||({notary:'NV2-01',upload:'UL-01',office:'NO-01'}[m]);
 if(m!==moduleOf(s.route)&&dirty())confirmBox('Giữ bản nháp khi chuyển phần?','Dữ liệu chưa xác nhận sẽ được giữ để bạn tiếp tục. Lưu nháp không đưa dữ liệu vào Chưa xếp.',()=>navigate(target),'Lưu nháp và chuyển');
 else navigate(target);
}
function closeDialog(restore=true){const el=$('#dialog');if(el.open)el.close();dialogRoute=null;pendingConfirm=null;if(restore&&dialogReturn?.isConnected)dialogReturn.focus()}
function showDialog(title,html,id=''){
 const el=$('#dialog');if(!el.open)dialogReturn=document.activeElement;
 el.innerHTML=`<div${id?` data-screen-id="${id}"`:''}><header class="dialog-head"><div class="od-field"><span class="screen-id">${esc(id||'Mô phỏng')}</span><h2 id="dialog-title">${esc(title)}</h2></div>${btn('close',icon('close'),{},'quiet')}</header><div class="dialog-body">${html}</div></div>`;
 el.querySelector('[data-action=close]').setAttribute('aria-label','Đóng cửa sổ');
 if(!el.open)el.showModal();
 requestAnimationFrame(()=>el.querySelector('button,input,select,textarea')?.focus());
}
function confirmBox(title,text,fn,label='Xác nhận'){
 pendingConfirm=fn;dialogRoute=null;showDialog(title,`<p>${esc(text)}</p><div class="dialog-actions">${btn('close','Ở lại')}${btn('confirm',esc(label),{},'primary')}</div>`);
}
function pageHead(id,desc='',actions=''){return `<header class="page-head"><div class="od-field"><div class="eyebrow">${moduleNames[moduleOf(id)]} <span aria-hidden="true">/</span> <span class="screen-id">${id}</span></div><h1 id="page-title" tabindex="-1">${screens[id]}</h1>${desc?`<p>${desc}</p>`:''}</div><div class="actions">${actions}</div></header>`}
const routeBtn=(r,t,c='')=>btn('go',t,{route:r},c);
function moduleTabs(){
 const m=moduleOf(s.route);
 const list=m==='notary'?[['NV2-01','Hồ sơ'],[C().mode==='ab'?'NV2-02':'NV2-03','Bàn soạn'],['NV2-04','Dữ liệu'],['NV2-07','Bộ văn bản']]:m==='upload'?[['UL-02','Phân tích dữ liệu'],['UL-03','Upload']]:[['NO-01','Tra cứu'],['NO-02','Đề xuất'],['NO-05','Tổng hợp']];
 return `<nav class="tabs" aria-label="Điều hướng trong phần">${list.map(([r,l])=>`<button type="button" data-action="go" data-route="${r}"${(s.route===r||(r==='UL-03'&&['UL-04','UL-05','UL-06'].includes(s.route))||(r==='UL-02'&&s.route==='UL-01'))?' aria-current="page"':''}>${l}</button>`).join('')}</nav>`;
}

function focusKey(el){if(!el?.dataset||!['BUTTON','INPUT','SELECT','TEXTAREA'].includes(el.tagName))return null;const data=Object.entries(el.dataset);return data.length?{tag:el.tagName,data}:null}
function restoreFocus(key){if(!key)return;const root=$('#dialog').open?$('#dialog'):document;const el=[...root.querySelectorAll(key.tag.toLowerCase())].find(e=>key.data.every(([k,v])=>e.dataset[k]===v));el?.focus({preventScroll:true})}
function render(){
 const returnKey=focusKey(document.activeElement);
 const m=moduleOf(s.route),c=C(),activeJobs=s.jobs.filter(j=>['running','waiting_user','partial','failed'].includes(j.status)).length;
 $('#app').innerHTML=`<div class="shell" data-screen-id="SH-01"><aside class="rail"><div class="logo" aria-label="Hồ sơ">h.</div><nav class="rail-nav" aria-label="Phần nghiệp vụ">${[['notary','folder','Soạn hồ sơ'],['upload','upload','Phân tích & Upload'],['office','office','Văn phòng']].map(([id,i,l])=>`<button type="button" data-action="module" data-module="${id}"${m===id?' aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('')}</nav><div class="rail-bottom">${btn('jobs',icon('clock')+'<span>Tác vụ</span>',{},'')}${btn('simulation',icon('settings')+'<span>Mô phỏng</span>',{},'')}<span class="rail-caption">SH-01</span></div></aside><div class="workspace"><header class="topbar"><div class="brand"><div class="od-field"><span class="brand-name">Không gian công chứng<span aria-hidden="true">.</span></span><span class="eyebrow">Một hồ sơ · xuyên suốt công việc</span></div></div><div class="tools">${btn('jobs',icon('clock')+`Tác vụ${activeJobs?' · '+activeJobs:''}`)}${btn('simulation',icon('settings')+'Tình huống')}<span class="avatar" title="Tài khoản minh họa" aria-label="Tài khoản demo">M</span></div></header><div class="sim-banner">${icon('shield')}<span>${SIM}</span></div><main id="main" class="main" data-screen-id="${s.route}">${moduleTabs()}<div class="fade">${renderRoute(s.route)}</div></main><footer class="app-foot"><span>Hồ sơ hư cấu · dữ liệu lưu trên trình duyệt này</span><span>22 tháng 09, 2026 · Bản demo</span></footer></div></div>`;
 if(!$('#dialog').open)requestAnimationFrame(()=>restoreFocus(returnKey));
}
function renderRoute(id){
 const state=s.viewStates[id]||'normal';
 if(state!=='normal'){
 const variants={empty:['Chưa có dữ liệu trong tình huống này','Chọn dữ liệu mẫu để bắt đầu thao tác.'],loading:['Đang tải dữ liệu mô phỏng','Tiến trình được điều khiển trong mục Tình huống; không có tác vụ mạng.'],error:['Chưa thể hoàn tất thao tác','DEMO-E01 · Lỗi mô phỏng. Dữ liệu và bản nháp vẫn được giữ; bạn có thể thử lại.'],unavailable:['Khả năng này chưa sẵn sàng','Dịch vụ mô phỏng chưa khả dụng. Không có kết nối thật hoặc thao tác chạy ngầm.']};
 const [title,body]=variants[state]||variants.error;
 return pageHead(id)+empty(title,body,btn('restore-state',state==='loading'?'Tiếp tục mô phỏng':'Dùng tình huống bình thường',{},'primary'))+(state==='loading'?'<div class="skeleton space-top" aria-hidden="true"><span></span><span></span><span></span></div>':'');
 }
 return views[id]?views[id]():empty('Mở qua cửa sổ chuyên biệt','Chọn thao tác dưới đây.',btn('open-screen','Mở cửa sổ',{route:id},'primary'));
}
const views={};
function caseContext(){return `<div class="contextbar"><div class="od-field"><strong>${esc(C().title)}</strong><span class="source-info">${C().id} · dữ liệu v${C().revision}</span></div>${select('diagram-mode','Kiểu sơ đồ',C().mode,[['ab','Hai bên A / B'],['family','Phả hệ thừa kế']])}${C().mode==='ab'?select('contract','Văn bản chính',C().contract,['Chuyển nhượng','Tặng cho','Cho thuê','Đặt cọc']):'<div class="od-field"><span>Văn bản chính</span><strong>Phân chia di sản DEMO</strong></div>'}</div>`}
views['NV2-01']=()=>{
 const list=s.cases.filter(c=>(c.title+' '+c.id).toLowerCase().includes(s.caseQuery.toLowerCase()));
 return pageHead('NV2-01','Tiếp tục hồ sơ, kiểm tra dữ liệu và xử lý phần còn chờ.',btn('new-case',icon('plus')+'Tạo hồ sơ',{},'primary'))+
 `<div class="stats"><div class="statbox"><div class="od-stat"><strong class="stat-num">${s.cases.length}</strong><span>Hồ sơ mẫu</span></div><span class="stat-icon">${icon('folder')}</span></div><div class="statbox"><div class="od-stat"><strong class="stat-num">${s.cases.reduce((n,c)=>n+c.people.filter(p=>p.dirty||!p.committed).length+c.assets.filter(p=>p.dirty||!p.committed).length,0)}</strong><span>Mục cần xác nhận</span></div><span class="stat-icon">${icon('users')}</span></div><div class="statbox"><div class="od-stat"><strong class="stat-num">${s.jobs.filter(j=>j.status==='waiting_user'||j.status==='partial').length}</strong><span>Tác vụ cần xem</span></div><span class="stat-icon">${icon('clock')}</span></div></div>
 <div class="cols"><section class="panel"><div class="panel-head"><h2>Hồ sơ gần đây</h2><span class="muted">Dữ liệu DEMO</span></div><div class="od-row">${input('case-query','Tìm hồ sơ',s.caseQuery)}${btn('case-search',icon('search'),{},'quiet')}</div><div class="space-top">${list.length?list.map(c=>`<article class="case-row"><div><div class="title-line"><span class="folder-mark">${icon(c.mode==='ab'?'folder':'users')}</span><div class="od-field"><h3 class="case-name">${esc(c.title)}</h3><span class="source-info">${c.id}</span></div></div><div class="case-meta">${badge(c.mode==='ab'?c.contract:'Thừa kế')}${badge(c.word.stale?'Văn bản cần cập nhật':'Đang soạn',c.word.stale?'warn':'info')}${badge(c.people.filter(p=>!p.committed||p.dirty).length+' mục chờ xác nhận','warn')}</div><div class="workflow"><span class="done">${icon('check')}Thu nhận</span><span>→ Dữ liệu</span><span>→ Sơ đồ</span><span>→ Văn bản</span></div></div><div class="actions">${btn('open-case','Mở hồ sơ '+icon('arrow'),{case:c.id})}</div></article>`).join(''):empty('Không thấy hồ sơ','Thử tên hoặc mã DEMO khác.')}</div></section>
 <aside class="stack"><section class="panel aside-lime"><div class="panel-head"><h3>Cần bạn xác nhận</h3>${icon('alert')}</div><p>Người và tài sản chỉ vào sơ đồ sau khi được kiểm tra.</p><div class="divider"></div><div class="od-field"><strong>${esc(C().title)}</strong><span>Bản nháp chưa vào Chưa xếp</span></div><div class="space-top">${routeBtn('NV2-04','Xem dữ liệu '+icon('arrow'),'quiet')}</div></section><section class="panel aside-peach"><h3>Mỗi việc, đúng một lần</h3><p class="space-small">Xuất thêm văn bản không tạo thêm công việc hoặc tính lại phí.</p><div class="space-top">${routeBtn('NO-01','Tra cứu công việc '+icon('arrow'),'quiet')}</div></section></aside></div>`;
};
function roleLabel(role){
 if(C().mode==='family')return {root:'Người để lại di sản',spouse:'Vợ / chồng',parents:'Cha / mẹ',children:'Con / cháu'}[role]||'Chưa xếp';
 const map={'Chuyển nhượng':['Bên chuyển nhượng','Bên nhận chuyển nhượng'],'Tặng cho':['Bên tặng cho','Bên được tặng cho'],'Cho thuê':['Bên cho thuê','Bên thuê'],'Đặt cọc':['Bên nhận đặt cọc','Bên đặt cọc']};
 return role==='A'?map[C().contract][0]:map[C().contract][1];
}
function personCard(p,assigned=false){
 const name=p.snapshot?.name||p.name;
 return `<article class="person" draggable="${p.committed&&!p.dirty}" data-person="${p.id}"><div class="od-row"><span class="initial">${esc(p.id.split('-').pop())}</span><div class="od-field od-fill"><strong>${esc(name)}</strong><span class="source-info">${p.id}</span></div></div>${p.dirty?badge('Dữ liệu đang sửa','warn'):''}<div class="actions">${btn('assign','Gán vào…',{person:p.id},'smallbtn',!p.committed||p.dirty)}${btn('inspect',icon('info'),{person:p.id},'quiet')}${assigned?btn('unassign','Bỏ gán',{person:p.id},'quiet'):''}</div></article>`;
}
function side(role){
 const members=C().people.filter(p=>C().assign[p.id]===role);
 return `<section class="side" data-drop="${role}" aria-label="${esc(roleLabel(role))}"><header class="side-head"><span class="side-letter">${C().mode==='ab'?role:icon('users')}</span><h3>${roleLabel(role)}</h3></header>${members.length?members.map(p=>personCard(p,true)).join(''):`<div class="empty-slot">${icon('plus')}<span>Gán người từ Chưa xếp</span></div>`}</section>`;
}
function workbench(){
 const c=C(),id=c.mode==='ab'?'NV2-02':'NV2-03';
 const pool=c.people.filter(p=>p.committed&&!p.dirty&&!c.assign[p.id]);
 return pageHead(id,'Sắp xếp người tham gia; dữ liệu gốc được giữ tại phần Dữ liệu.',btn('save-diagram',icon('check')+'Lưu sơ đồ',{},'primary'))+caseContext()+
 (c.diagramStale||!c.diagramSaved?note('<strong>Sơ đồ cần được rà soát.</strong><span>Dữ liệu hoặc cách gán đã đổi. Kiểm tra rồi lưu sơ đồ trước khi xuất văn bản.</span>','warn'):'')+
 `<div class="workbench space-top"><section class="panel pool"><div class="panel-head"><h3>Chưa xếp</h3>${badge(String(pool.length))}</div><p class="muted">Chỉ gồm dữ liệu đã xác nhận.</p><div class="pool-people space-top">${pool.length?pool.map(p=>personCard(p)).join(''):note('Không còn người chưa xếp.')}</div><div class="space-top">${routeBtn('NV2-04',icon('plus')+'Dữ liệu người')}</div></section><div class="stack"><section class="canvas"><div class="panel-head"><div class="od-field"><span class="eyebrow">Văn bản chính</span><h2>${c.mode==='ab'?esc('Hợp đồng '+c.contract.toLowerCase()):'Phả hệ thừa kế'}</h2></div>${badge(c.diagramSaved&&!c.diagramStale?'Đã lưu':'Cần rà soát',c.diagramSaved&&!c.diagramStale?'good':'warn')}</div>${c.mode==='ab'?`<div class="sides">${side('A')}${side('B')}</div>`:`<div class="family"><div class="family-root">${side('root')}</div><div class="family-line" aria-hidden="true"></div><div class="branches">${side('spouse')}${side('parents')}${side('children')}</div>${note('Quan hệ dùng để review bố cục; demo không tự tính phần thừa kế hoặc suy người từ chối.','warn')}</div>`}<section class="panel"><h3>Tài sản trong hồ sơ</h3><p class="muted">Chọn từ dữ liệu đã xác nhận.</p>${c.assets.filter(a=>a.committed&&!a.dirty).map(a=>check('asset-select',a.snapshot.name,c.selectedAssets.includes(a.id),{asset:a.id})).join('')||'<p>Chưa có tài sản đã xác nhận.</p>'}</section></section><div class="actions">${routeBtn('NV2-04','Sửa dữ liệu')}${btn('zalo','Kết nối Zalo')}${routeBtn('NV2-07','Bộ văn bản '+icon('arrow'))}</div></div></div>`;
}

const INTAKE=[['id','DEMO_ID_A_FRONT.png','OCR · Người'],['asset','DEMO_GCN_NONVALID.pdf','OCR · Tài sản'],['note','DEMO_NOTE.txt','Chuyển đổi văn bản · Cần xác định']];
function stage(kind){

 return `<section class="panel"><div class="panel-head"><div class="od-field"><h2>Dữ liệu ${people?'người':'tài sản'}</h2><span class="muted">Xác nhận độc lập · v${c.revision}</span></div>${btn('add-item',icon('plus')+'Thêm tay',{kind},'quiet')}</div>${list.some(p=>!p.name.trim())?note('<strong>Cần bổ sung tên</strong>'+list.filter(p=>!p.name.trim()).map(p=>btn('focus-item',esc(p.id),{id:p.id},'quiet')).join(''),'bad'):''}${list.map(p=>`<article class="stage-card"><div class="stage-header"><code>${p.id}</code>${badge(!p.committed?'Bản nháp':p.dirty?'Chưa cập nhật':'Đã vào Chưa xếp',!p.committed||p.dirty?'warn':'good')}</div>${input('stage-name',people?'Tên nhân vật hư cấu *':'Tên tài sản hư cấu *',p.name,{kind,id:p.id})}<span id="error-${p.id}" class="field-error"${p.name.trim()?' hidden':''}>Cần nhập tên trước khi xác nhận.</span>${input('stage-detail','Ghi chú dữ liệu',p.detail,{kind,id:p.id})}<span class="source-info">Nguồn: ${esc(p.source)}${!people?' · có thể chung nguồn với tài sản khác':''}</span><div class="actions">${btn('revert-item',p.committed?'Bỏ chỉnh sửa':'Bỏ mục nháp',{kind,id:p.id},'quiet')}${btn('source-item','Xem nguồn',{kind,id:p.id},'quiet')}</div></article>`).join('')||empty('Chưa có dữ liệu',`Thêm ${people?'người':'tài sản'} thủ công hoặc lấy từ lô mẫu.`)}<div class="space-top">${btn('commit-stage',`Xác nhận ${people?'người':'tài sản'}`,{kind},'',!list.some(p=>!p.committed||p.dirty))}</div></section>`;
}

function baseline(){
 const c=C(),issues=[];
 if([...c.people,...c.assets].some(p=>p.dirty||!p.committed))issues.push(['Dữ liệu còn bản nháp hoặc thay đổi chưa xác nhận.','NV2-04']);
 if(!c.diagramSaved||c.diagramStale)issues.push(['Sơ đồ chưa lưu theo dữ liệu hiện tại.',c.mode==='ab'?'NV2-02':'NV2-03']);
 const assigned=Object.values(c.assign);
 if(c.mode==='ab'&&(!assigned.includes('A')||!assigned.includes('B')))issues.push(['Cần người tham gia ở cả bên A và B.','NV2-02']);
 if(c.mode==='family'&&(!assigned.includes('root')||!assigned.some(r=>r!=='root')))issues.push(['Cần người để lại di sản và ít nhất một quan hệ.','NV2-03']);
 if(!c.selectedAssets.length)issues.push(['Chưa chọn tài sản của văn bản.',c.mode==='ab'?'NV2-02':'NV2-03']);
 return issues;
}

function newQueue(){return ['1/2025','3/2025'].map((no,i)=>({no,source:i?'DEMO_03-2026.docx':'DEMO_01-2025.docx',version:1,preparedVersion:0,attachment:null,attachmentType:'scan',pages:[{id:'DEMO_PAGE_01.png',rotation:0},{id:'DEMO_PAGE_02.png',rotation:0}],reviewed:false,result:'not_saved'}))}
function rowErrors(row){
 const errs=[];
 if(!contextReady()||!U().coverage||U().year!=='2025'||U().book!=='SỔ CÔNG CHỨNG DEMO-A')errs.push('Ngữ cảnh chưa được xác minh');
 if(row.source.includes('2026'))errs.push('File sai năm');
 if(row.source==='duplicate')errs.push('Hai file cùng nhận một số');
 if(!row.source)errs.push('Chưa chọn nguồn');
 if(!row.attachment)errs.push('Chưa có attachment');
 if(!row.reviewed)errs.push('Bộ tệp chưa xác nhận');
 if(row.attachmentType==='unsupported')errs.push('Định dạng nguồn chưa hỗ trợ');
 if(row.attachment&&row.preparedVersion!==row.version)errs.push('Nguồn đã thay đổi');
 if(U().capability==='unknown')errs.push('Chưa biết khả năng cổng');
 if(row.attachmentType==='render'&&U().capability==='scan')errs.push('Cổng yêu cầu bản scan');
 if(U().overLimit)errs.push('Vượt giới hạn mẫu');
 if(row.attachmentType==='render'&&!U().engine)errs.push('Engine PDF chưa khả dụng');
 return errs;
}

 return note(SIM)+qrIllustration()+`<div class="od-field"><strong>${({waiting:'Chờ quét mã mẫu',expired:'Mã mẫu đã hết hạn',confirming:'Chờ xác nhận trên thiết bị mẫu',connected:'Đã kết nối mô phỏng',error:'Không kết nối được trong tình huống này'})[z.status]}</strong><span class="muted">QR đăng nhập Zalo khác QR đọc giấy tờ. Demo không đăng nhập tài khoản thật.</span></div><div class="actions">${z.status==='waiting'?btn('qr-scan','Giả lập đã quét',{},'primary'):z.status==='confirming'?btn('qr-confirm','Giả lập xác nhận',{},'primary'):z.status==='connected'?btn('zalo-sources','Chọn nguồn '+icon('arrow'),{},'primary'):btn('qr-retry','Tạo mã mẫu mới',{},'primary')}${select('qr-state','Tình huống mã',z.status,[['waiting','Chờ quét'],['expired','Hết hạn'],['confirming','Chờ xác nhận'],['connected','Đã kết nối mẫu'],['error','Lỗi mẫu']])}</div>`;

 return note(SIM)+`<div class="two"><section class="panel stack"><h3>Tác vụ trong phiên</h3>${s.jobs.length?s.jobs.map(j=>`<article class="stage-card"><div class="od-field"><strong>${esc(j.title)}</strong><span class="source-info">${j.id} · ${j.caseId}</span></div>${badge(jobLabels[j.status],j.status==='succeeded'?'good':j.status==='failed'?'bad':'warn')}<div class="actions">${btn('resume-job','Đi tới tác vụ',{id:j.id})}${['accepted','running','waiting_user'].includes(j.status)?btn('cancel-job','Hủy tác vụ',{id:j.id},'quiet'):''}</div></article>`).join(''):empty('Chưa có tác vụ','Các bước xử lý lô mẫu sẽ xuất hiện ở đây.')}</section><section class="panel stack"><h3>Trạng thái hệ thống mẫu</h3>${select('health','Tình huống dịch vụ',s.health,[['online','Online · mô phỏng'],['degraded','Degraded · một phần'],['unavailable','Unavailable · chưa khả dụng']])}${['QR / Zalo','OCR','Word','Upload / Portal'].map(n=>`<div class="list-row"><span>${n}</span>${badge(s.health==='online'?'Sẵn sàng mẫu':s.health==='degraded'?'Hạn chế mẫu':'Chưa khả dụng',s.health==='online'?'good':'warn')}</div>`).join('')}${btn('database','Thông tin hạ tầng '+icon('arrow'))}</section></div>`;

function openScreen(route,data={}){
 dialogRoute=route;dialogData=data;
 if(route==='UL-04'&&data.no)U().activeRow=data.no;
 const content=route==='NV2-05'?zaloQr():route==='NV2-06'?zaloSources():route==='UL-04'?attachmentView():jobView();
 showDialog(screens[route],content,route);
}
function refreshDialog(){const returnKey=focusKey(document.activeElement);if(dialogRoute==='simulation')simulation();else if(dialogRoute)openScreen(dialogRoute,dialogData);requestAnimationFrame(()=>restoreFocus(returnKey))}
function simulation(){
 dialogRoute='simulation';
 const u=U();
 showDialog('Tình huống mô phỏng',`<p>Chỉ thay dữ liệu mẫu để xem phản hồi giao diện. Không điều khiển dịch vụ thật.</p><div class="two"><section class="panel stack"><h3>Màn hình hiện tại</h3><p>${s.route} · ${screens[s.route]}</p>${select('view-state','Trạng thái màn hình',s.viewStates[s.route]||'normal',[['normal','Bình thường'],['loading','Đang tải'],['empty','Trống'],['error','Lỗi có thể thử lại'],['unavailable','Chưa khả dụng']])}${select('health','Dịch vụ mô phỏng',s.health,[['online','Online'],['degraded','Degraded'],['unavailable','Unavailable']])}</section><section class="panel stack"><h3>Phân tích & Upload</h3>${select('coverage','Độ phủ 2025',u.coverage?'verified':'unverified',[['unverified','Chưa xác minh'],['verified','Đã xác minh 1 → 4']])}${select('capability','Khả năng cổng',u.capability,[['scan','Bắt buộc PDF scan'],['render','Cho phép PDF từ Word'],['unknown','Chưa rõ khả năng']])}${check('pdf-engine','Engine Word → PDF mẫu sẵn sàng',u.engine)}${check('over-limit','Tệp mẫu vượt giới hạn',u.overLimit)}${u.sessionStarted?select('session-result','Kết quả mục cuối phiên',u.queue.filter(r=>r.inSession).at(-1)?.result||'not_saved',[['not_saved','Chưa lưu'],['unknown','Chưa rõ kết quả'],['failed','Lỗi']]):''}</section></div><div class="notice warn"><strong>Các giới hạn vẫn giữ nguyên</strong><span>A1/A3/A4, bảo mật, biểu phí và khả năng cổng chưa được xác minh. Không tạo file Word/PDF hoặc gửi dữ liệu thật.</span></div><div class="dialog-actions">${btn('reset','Reset demo',{},'danger')}${btn('close','Trở lại thao tác',{},'primary')}`);
}

let assignmentPerson='',assignmentRole='',newTitle='Hồ sơ mới DEMO',newMode='ab';
function rerender(){save();render()}
function stale(c){c.word.stale=c.word.outputs.length>0;c.word.prechecked=false}
function markDiagram(c){c.diagramSaved=false;stale(c)}
function dialogError(message){
 let el=$('#dialog-error');if(!el){el=document.createElement('div');el.id='dialog-error';el.className='notice bad';el.setAttribute('role','alert');$('#dialog .dialog-body')?.prepend(el)}el.textContent=message;
}
function readyService(){if(s.health==='unavailable'){toast('Dịch vụ mô phỏng chưa khả dụng. Đổi tình huống hệ thống để tiếp tục.');return false}return true}
function requestRoute(route,data={}){
 if(moduleOf(route)!==moduleOf(s.route)&&dirty())confirmBox('Giữ dữ liệu khi chuyển phần?','Bản nháp được lưu để tiếp tục; dữ liệu chưa xác nhận vẫn chưa vào Chưa xếp.',()=>navigate(route,data),'Lưu nháp và chuyển');
 else navigate(route,data);
}
function assignment(pid,role){
 const c=C(),p=c.people.find(x=>x.id===pid);
 if(!p||!p.committed||p.dirty){toast('Xác nhận dữ liệu người trước khi gán vào sơ đồ.');return false}
 if(role==='root'&&Object.entries(c.assign).some(([id,r])=>r==='root'&&id!==pid)){toast('Đã có người để lại di sản. Bỏ gán hiện tại trước khi thay.');return false}
 if(role)c.assign[pid]=role;else delete c.assign[pid];
 markDiagram(c);save();return true;
}
function showSource(item){
 dialogRoute=null;
 showDialog('Dữ kiện nguồn',`<div class="od-field"><strong>${esc(item.source)}</strong><span>${esc(item.id)} · nguồn chỉ là fixture</span></div><div class="paper"><div class="paper-mark">DEMO · KHÔNG PHẢI GIẤY TỜ THẬT</div><h3>${esc(item.snapshot?.name||item.name)}</h3><p>${esc(item.snapshot?.detail||item.detail)}</p><div class="paper-lines" aria-hidden="true"><i></i><i></i><i></i></div></div>${note('Dữ liệu nhập tay có nguồn Thủ công; demo không giả đã chạy OCR cho dữ liệu này.')}`);
}
function beginWord(){
 const c=C(),w=c.word;
 if(!readyService())return;
 if(baseline().length||w.template==='DEMO-TPL-unavailable'||!Object.values(w.docs).some(Boolean)){toast('Sửa các điều kiện chưa đạt trước khi xuất.');return}
 const run=()=>{
 w.outputs=Object.keys(w.docs).filter(k=>w.docs[k]).map((id,i)=>({id,status:i===0?'running':'queued',revision:c.revision,diagramVersion:c.diagramVersion,template:w.template}));
 w.running=true;w.stale=false;job('WORD-'+c.id,'Tạo bộ văn bản DEMO','NV2-07','running');rerender();
 };
 if(w.outputs.length)confirmBox('Tạo bộ kết quả mô phỏng mới?','Kết quả trong demo sẽ được thay bằng phiên bản hiện tại. Không có file thật trên máy bị ghi đè.',run,'Xuất lại mô phỏng');else run();
}
function finishWord(){
 const c=C(),w=c.word;let priorError=false;
 w.outputs.forEach(o=>{
 if(o.id==='tax'&&!w.taxField.trim()){o.status='failed';priorError=true}
 else if(o.id==='request'&&priorError)o.status='skipped';
 else o.status='succeeded';
 });
 w.running=false;job('WORD-'+c.id,'Tạo bộ văn bản DEMO','NV2-07',w.outputs.every(o=>o.status==='succeeded')?'succeeded':'partial');rerender();toast('Đã cập nhật kết quả từng văn bản mô phỏng.');
}
function proposalConfirm(){
 const p=s.office.proposal;
 if(p.evidence==='missing'){toast('Chưa đủ bằng chứng. Giữ nháp để xem lại.');return}
 if(p.state!=='candidate'){toast('Đề xuất này đã có quyết định.');return}
 const existing=s.office.records.find(r=>r.caseId===p.caseId&&r.type===p.type);
 if(existing&&!p.linkExisting&&!p.reason.trim()){toast('Ghi lý do đây là một yêu cầu khác trước khi tạo thêm công việc.');document.querySelector('[data-input=proposal-reason]')?.focus();return}
 confirmBox('Xác nhận công việc mô phỏng?',existing&&p.linkExisting?'Bổ sung dữ kiện vào công việc đã có; không tạo công việc hoặc khoản phí trùng.':'Ghi nhận một công việc mới theo lựa chọn. Trạng thái ban đầu là Đã tiếp nhận, phí Chưa xác định.',()=>{
 let record=existing&&p.linkExisting?existing:null;
 if(record){for(const ev of ['EVD-DEMO-WORD-01','EVD-DEMO-PRINT-01'])if(!record.evidence.includes(ev))record.evidence.push(ev);record.history.push('Xác nhận bổ sung dữ kiện DEMO')}
 else{record={id:'REC-DEMO-'+String(s.nextId++).padStart(3,'0'),caseId:p.caseId,type:p.type,status:'Đã tiếp nhận',fee:'unknown',amount:'',source:'Word',station:'PC-DEMO-02',evidence:['EVD-DEMO-WORD-01','EVD-DEMO-PRINT-01'],files:[],history:['Người xem demo xác nhận công việc'],date:'2026-09-22'};s.office.records.push(record)}
 p.state='confirmed';p.decision=`Đã xác nhận vào ${record.id}. Không tự hoàn tất hoặc tính phí.`;s.office.recordId=record.id;rerender();toast('Đã ghi nhận quyết định trong dữ liệu mẫu.');
 },'Xác nhận mô phỏng');
}
const actions={
 go:(el)=>requestRoute(el.dataset.route),
 module:el=>changeModule(el.dataset.module),
 close:()=>closeDialog(),
 confirm:()=>{const fn=pendingConfirm;closeDialog(false);fn?.()},
 jobs:()=>openScreen('SH-02'),
 simulation,
 database:()=>navigate('DB-01'),
 'open-screen':el=>openScreen(el.dataset.route),
 'restore-state':()=>{s.viewStates[s.route]='normal';rerender()},
 'case-search':()=>render(),
 'focus-item':el=>document.querySelector('[data-input="stage-name"][data-id="'+el.dataset.id+'"]')?.focus(),
 'new-case':()=>{
 newTitle='Hồ sơ mới DEMO';newMode='ab';dialogRoute=null;
 showDialog('Tạo hồ sơ mẫu',`${input('new-title','Tên hồ sơ *',newTitle)}${select('new-mode','Kiểu sơ đồ',newMode,[['ab','Hai bên A / B'],['family','Phả hệ thừa kế']])}${note('Hồ sơ mới bắt đầu trống. Dùng dữ liệu hư cấu, không nhập thông tin cá nhân thật.')}<div class="dialog-actions">${btn('close','Hủy')}${btn('create-case','Tạo hồ sơ',{},'primary')}</div>`);
 },
 'create-case':()=>{
 if(!newTitle.trim()){dialogError('Cần nhập tên hồ sơ trước khi tạo.');return}
 const id='CASE-DEMO-'+String(s.nextId++).padStart(3,'0');s.cases.unshift(makeCase(id,newTitle.trim(),newMode,true));s.caseId=id;navigate('NV2-04');toast('Đã tạo hồ sơ mẫu trống.');
 },
 'open-case':el=>{
 const c=s.cases.find(x=>x.id===el.dataset.case);if(!c)return;
 const go=()=>{s.caseId=c.id;navigate(c.mode==='ab'?'NV2-02':'NV2-03')};
 if(c.id!==s.caseId&&dirty())confirmBox('Chuyển hồ sơ đang mở?','Dữ liệu nháp của hồ sơ hiện tại được giữ riêng, không chuyển sang hồ sơ mới.',go,'Giữ nháp và chuyển');else go();
 },
 assign:el=>{
 assignmentPerson=el.dataset.person;assignmentRole=C().assign[assignmentPerson]||'';
 const roles=C().mode==='ab'?['A','B']:['root','spouse','parents','children'];dialogRoute=null;
 showDialog('Gán người vào sơ đồ',`<p>${esc(C().people.find(p=>p.id===assignmentPerson)?.name)}</p>${select('assignment-role','Vị trí',assignmentRole,[['','Chưa xếp'],...roles.map(r=>[r,roleLabel(r)])])}<div class="dialog-actions">${btn('close','Hủy')}${btn('apply-assignment','Áp dụng',{},'primary')}</div>`);
 },
 'apply-assignment':()=>{if(assignment(assignmentPerson,assignmentRole)){closeDialog();rerender();toast('Đã thay đổi cách gán. Lưu sơ đồ để tiếp tục.')}else dialogError('Không thể gán vào vị trí này. Kiểm tra dữ liệu hoặc vị trí đã có người.')},
 unassign:el=>{assignment(el.dataset.person,'');rerender();toast('Đã trả người về Chưa xếp, dữ liệu gốc vẫn giữ.')},
 inspect:el=>showSource(C().people.find(p=>p.id===el.dataset.person)),
 'save-diagram':()=>{
 const c=C(),roles=Object.values(c.assign);
 if(!c.selectedAssets.length){toast('Chọn ít nhất một tài sản đã xác nhận.');return}
 if(c.mode==='ab'&&(!roles.includes('A')||!roles.includes('B'))){toast('Gán người vào cả bên A và B trước khi lưu.');return}
 if(c.mode==='family'&&(!roles.includes('root')||!roles.some(r=>r!=='root'))){toast('Gán người để lại di sản và ít nhất một quan hệ.');return}
 if(Object.keys(c.assign).some(id=>{const p=c.people.find(p=>p.id===id);return !p||p.dirty||!p.committed})){toast('Người đã gán có dữ liệu chưa xác nhận. Quay lại phần Dữ liệu.');return}
 c.diagramSaved=true;c.diagramStale=false;c.diagramVersion++;stale(c);rerender();toast('Đã lưu sơ đồ theo dữ liệu hiện tại.');
 },
 'add-item':el=>{
 const kind=el.dataset.kind,id=(kind==='people'?'DEMO-PERSON-':'DEMO-ASSET-')+'NEW-'+s.nextId++;
 const item=person(id,kind==='people'?'NHÂN VẬT HƯ CẤU MỚI':'TÀI SẢN HƯ CẤU MỚI',false);item.source='Thủ công';C()[kind].push(item);rerender();
 },
 'revert-item':el=>{
 const c=C(),kind=el.dataset.kind,p=c[kind].find(p=>p.id===el.dataset.id);
 confirmBox(p.committed?'Bỏ chỉnh sửa chưa xác nhận?':'Bỏ mục nháp này?','Thao tác chỉ ảnh hưởng dữ liệu mẫu đang sửa. Nguồn gốc vẫn giữ nguyên.',()=>{
 if(p.committed){p.name=p.snapshot.name;p.detail=p.snapshot.detail;p.dirty=false}else c[kind]=c[kind].filter(x=>x.id!==p.id);
 rerender();
 },'Bỏ thay đổi');
 },
 'source-item':el=>showSource(C()[el.dataset.kind].find(p=>p.id===el.dataset.id)),
 'commit-stage':el=>{
 const c=C(),list=c[el.dataset.kind],invalid=list.filter(p=>!p.name.trim());
 if(invalid.length){render();toast('Có mục thiếu tên. Hãy bổ sung trước khi xác nhận.');requestAnimationFrame(()=>document.querySelector(`[data-input="stage-name"][data-id="${invalid[0].id}"]`)?.focus());return}
 for(const p of list){p.snapshot={name:p.name.trim(),detail:p.detail};p.name=p.name.trim();p.committed=true;p.dirty=false}
 c.revision++;c.diagramStale=true;stale(c);rerender();toast('Đã cập nhật vào Chưa xếp. Rà soát và lưu lại sơ đồ.');
 },
 'intake-start':()=>{
 if(!readyService())return;const c=C();if(!c.intakeSelected.length){toast('Chọn ít nhất một file mẫu.');return}
 c.intake='routing';c.intakeTransferred=false;job('INTAKE-'+c.id,'Xử lý lô tài liệu mẫu','NV2-04','running');rerender();
 },
 'intake-next':()=>{
 const c=C(),next={routing:'processing',processing:'classification',classification:'done'};c.intake=next[c.intake]||'done';
 job('INTAKE-'+c.id,'Xử lý lô tài liệu mẫu','NV2-04',c.intake==='done'?(!c.cloud&&c.intakeSelected.some(k=>k!=='note')?'partial':'waiting_user'):'running');rerender();
 },
 'intake-cancel':()=>{C().intake='idle';job('INTAKE-'+C().id,'Xử lý lô tài liệu mẫu','NV2-04','canceled');rerender()},
 'intake-transfer':()=>{

 case 'office-scope':s.office.scope=v;break;
 case 'proposal-type':s.office.proposal.type=v;s.office.proposal.state='candidate';s.office.proposal.decision='';break;
 case 'proposal-case':s.office.proposal.caseId=v;s.office.proposal.state='candidate';s.office.proposal.decision='';break;
 case 'proposal-link':s.office.proposal.linkExisting=on;break;
 case 'evidence-state':s.office.proposal.evidence=v;break;
 case 'record-status':{
 const r=R(),old=r.status;el.value=old;
 if(v!==old)confirmBox('Đổi trạng thái công việc?',`Đổi từ “${old}” sang “${v}”. Thao tác này không thay đổi file, khoản phí hoặc thanh toán.`,()=>{r.status=v;r.history.push('Trạng thái được xác nhận: '+v);rerender()},'Xác nhận trạng thái');
 repaint=false;break;
 }
 case 'fee-state':{const r=R();r.feeDraft={state:v,amount:r.feeDraft?.amount??r.amount};break}
 case 'office-filter':s.office[el.dataset.field]=v;break;
 }
 save();if(repaint)render();if(repaintDialog)refreshDialog();
});
document.addEventListener('input',event=>{
 const el=event.target.closest('[data-input]');if(!el)return;
 const a=el.dataset.input,v=el.value;
 switch(a){
 case 'new-title':newTitle=v;break;
 case 'case-query':s.caseQuery=v;break;
 case 'office-query':s.office.query=v;break;
 case 'stage-name':
 case 'stage-detail':{
 const p=C()[el.dataset.kind].find(p=>p.id===el.dataset.id);if(!p)return;
 p[a==='stage-name'?'name':'detail']=v;p.dirty=true;
 const b=el.closest('.stage-card')?.querySelector('.badge');if(b){b.textContent='Chưa cập nhật';b.className='badge warn'}
 const commit=document.querySelector(`[data-action="commit-stage"][data-kind="${el.dataset.kind}"]`);if(commit)commit.disabled=false;
 break;
 }
 case 'tax-field':C().word.taxField=v;break;
 case 'proposal-reason':s.office.proposal.reason=v;break;
 case 'fee-amount':{const r=R();if(!r.feeDraft)r.feeDraft={state:r.fee,amount:r.amount};r.feeDraft.amount=v;break}
 }
 save();
});
document.addEventListener('focusout',event=>{
 const el=event.target;
 if(el.matches('[data-input="stage-name"]')){
 const error=document.getElementById('error-'+el.dataset.id),invalid=!el.value.trim();
 if(error)error.hidden=!invalid;
 el.setAttribute('aria-invalid',String(invalid));el.setAttribute('aria-describedby','error-'+el.dataset.id);
 }
});
document.addEventListener('keydown',event=>{
 if(event.key==='Enter'&&event.target.matches('[data-input="office-query"]')){event.preventDefault();actions['office-search']()}
 if(event.key==='Enter'&&event.target.matches('[data-input="case-query"]')){event.preventDefault();actions['case-search']()}
 const dialog=$('#dialog');
 if(event.key==='Tab'&&dialog.open){
 const focusable=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(e=>e.getClientRects().length);
 if(!focusable.length)return;
 const first=focusable[0],last=focusable.at(-1);
 if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
 else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
 }
});
$('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog()});
let dragging='';
document.addEventListener('dragstart',event=>{const card=event.target.closest('[data-person]');if(!card)return;dragging=card.dataset.person;event.dataTransfer.setData('text/plain',dragging);event.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',event=>{if(event.target.closest('[data-drop]')){event.preventDefault();event.dataTransfer.dropEffect='move'}});
document.addEventListener('drop',event=>{const target=event.target.closest('[data-drop]');if(!target)return;event.preventDefault();const id=event.dataTransfer.getData('text/plain')||dragging;if(assignment(id,target.dataset.drop)){rerender();toast('Đã gán người. Lưu sơ đồ để xác nhận.')}dragging=''});
if(!screens[s.route]||['SH-02','NV2-05','NV2-06','UL-04'].includes(s.route))s.route='NV2-01';
render();
</script>
</body>
</html>
